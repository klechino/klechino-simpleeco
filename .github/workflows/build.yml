name: Build ArcticSus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle clean build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArcticSus-1.0.1
          path: build/libs/ArcticSus-1.0.1.jar
          if-no-files-found: error
